<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Collision Simulator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Collision Simulator</h1>

    <div id="app">
        <div id="playground">
            <canvas></canvas>

            <div id="display">
                <div class="stat">
                    <span class="label">Balls</span>
                    <span class="value" id="stat-balls">0</span>
                </div>
                <div class="stat">
                    <span class="label">Kinetic Energy</span>
                    <span class="value" id="stat-KE">0</span>
                </div>
                <div class="stat">
                    <span class="label">FPS</span>
                    <span class="value" id="stat-fps">0</span>
                </div>
            </div>
        </div>

        <div id="controler">
            <h2>Controls</h2>

            <div class="control-group">
                <label for="ball-count">Add Ball</label>
                <button id="add-ball">Add Ball</button>
            </div>

            <div class="control-group">
                <label for="speed">Speed</label>
                <input type="range" id="speed" min="0" max="5" step="0.5" value="1">
            </div>

            <div class="control-group">
                <label for="restitution">Restitution</label>
                <input type="range" id="restitution" min="0" max="1" step="0.1" value="1">
            </div>

            <div class="control-group">
                <button id="toggle-run">Pause</button>
                <button id="reset">Reset</button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
