<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Collision Simulator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Collision Simulator</h1>

    <div id="app">
        <div id="playground">
            <canvas></canvas>

            <div id="display">
                <div class="stat">
                    <span class="label">Balls</span>
                    <span class="value" id="stat-balls">0</span>
                </div>
                <div class="stat">
                    <span class="label">Collisions</span>
                    <span class="value" id="stat-collisions">0</span>
                </div>
                <div class="stat">
                    <span class="label">FPS</span>
                    <span class="value" id="stat-fps">0</span>
                </div>
            </div>
        </div>

        <div id="controler">
            <h2>Controls</h2>

            <div class="control-group">
                <label for="ball-count">Ball Count</label>
                <input type="range" id="ball-count" min="1" max="100" value="20">
            </div>

            <div class="control-group">
                <label for="speed">Speed</label>
                <input type="range" id="speed" min="1" max="20" value="10">
            </div>

            <div class="control-group">
                <label for="radius">Radius</label>
                <input type="range" id="radius" min="5" max="50" value="20">
            </div>

            <div class="control-group">
                <button id="toggle-run">Pause</button>
                <button id="reset">Reset</button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
